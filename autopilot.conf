# Autopilot settings (framework 1.9). Read by tools/autopilot.py; an environment variable of the same name wins.
# Changing AUTOPILOT_MODEL is a patch-level proposal: the autopilot refuses to continue an open edition with
# a different model than the one it started with.
AUTOPILOT_MODEL=claude-opus-5-5
AUTOPILOT_PERMISSION_MODE=auto
# Editions start on their due date (state date of the previous edition + 14 days) from this local hour.
AUTOPILOT_START_HOUR=20
# A headless run is stopped after this many hours; the next tick resumes it.
AUTOPILOT_MAX_RUN_HOURS=12
# Interim resolutions this many days after an edition's state date.
AUTOPILOT_INTERIM_AFTER_DAYS=7
# Weekly harvest source repair on this weekday (1 = Monday … 7 = Sunday) when at least N sources fail.
AUTOPILOT_REPAIR_DOW=7
AUTOPILOT_REPAIR_MIN_FAILING=3
# Evidence file for the quarterly review from this date.
AUTOPILOT_QPREP_FROM=2026-12-19
# Weekly harvest backup (Sundays). Empty = no backup. Example: /Volumes/Backup/worldstate
BACKUP_DIR=
